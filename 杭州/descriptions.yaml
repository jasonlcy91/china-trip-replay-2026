gallery_tiles:
    中国京杭大运河博物馆: "大运河承载着历史的沧桑与华夏文明的源远流长"
    胡雪岩故居: "一步一景，如诗如画。胡雪岩——清末红顶商人，富可敌国的著名徽商；其宅邸占地10.8亩，耗资300万白银，江南园林艺术的典范，展示了胡雪岩的奢华生活"
    柳浪闻莺: |-
        西湖十景之一，位于西湖东南岸, 对望苏堤。题名景观"柳浪闻莺"始于南宋。

        📍【机位怎么走】
        1️⃣ 导航至「柳浪闻莺东门」进入
        2️⃣ 直行至岔路口右转，沿小路走约300米
        3️⃣ 看到古风石桥「新横河桥」——桥下就是秘境入口！
        4️⃣ 桥左侧见「闻莺馆」石碑，左转下石阶
        5️⃣ 豁然开朗！绿树、桥洞、倒影构成油画世界
            
        📸 推荐拍摄时间：早晨6-9点，人少光柔，倒影绝美
        👗 穿搭建议：汉服/白裙更出片
        🕘 开放时间：全年全天免费
    良渚古城遗址公园: "良渚古城遗址是长江下游地区首次发现的新石器时代城址，距今约5300至4300年，显出了中国历史长河的悠久"
    晓霞弄: "仿佛瞬间从喧嚣走入静谧"
    "南宋御街 · 800年前的CBD!": "曾经的皇家专用道路, 南宋御街陈列馆里有展示南宋御街遗址，见证南宋全盛时期杭州古都的繁华景象，主街和支线隐匿着无数小店，小饭馆、咖啡馆"
    小河直街: "白墙黛瓦, 江南风味的古街",
    "西湖·断桥残雪": "因桥身在雪后部分消融，远看似断非断而得名。这里也承载了许仙和白娘子借伞初遇"

food:
    "龙井村 · 龙井茂居 · 中式下午茶 · 周杰伦带火🔥": |-
        美团可团购

        📍导航终点：
        打车到“龙井村村委会”，在有个龙井村的牌坊那下车

        🚶步行路线：
        可以开启手机导航，往里走大概15-20分钟就到了～
        路途中间还会路过“82”，Chanel广告拍摄的地方，也很漂亮